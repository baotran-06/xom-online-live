name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix bridge
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check WebGL and audio output
        run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-feature-screenshots
          path: artifacts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Execute START and STOP BAT on Windows
        run: node --test tests/windows-launcher.test.js
  deploy:
    needs: [test-build, windows-launcher]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
